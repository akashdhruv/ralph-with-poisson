args = "{\"path\": \"generated-src/poisson/solvers.py\", \"content\": \"\\\"\\\"\\\"Solvers for the 2-D Poisson equation on a Grid.\\\"\\\"\\\"\\n\\nimport numpy as np\\n\\n\\n# ---------------------------------------------------------------------------\\n# Helpers\\n# ---------------------------------------------------------------------------\\n\\ndef _laplacian(phi, dx, dy):\\n    \\\"\\\"\\\"Discrete Laplacian of *phi* at interior points (returns interior-sized array).\\\"\\\"\\\"\\n    idx2 = 1.0 / (dx * dx)\\n    idy2 = 1.0 / (dy * dy)\\n    L = (phi[2:, 1:-1] - 2.0 * phi[1:-1, 1:-1] + phi[:-2, 1:-1]) * idx2 \\\\\\n      + (phi[1:-1, 2:] - 2.0 * phi[1:-1, 1:-1] + phi[1:-1, :-2]) * idy2\\n    return L\\n\\n\\ndef _residual(grid):\\n    \\\"\\\"\\\"Compute r = f - L(phi) on interior points and return its L2 norm.\\\"\\\"\\\"\\n    grid.apply_neumann()\\n    L = _laplacian(grid.phi, grid.dx, grid.dy)\\n    r = grid.rhs[1:-1, 1:-1] - L\\n    return np.sqrt(np.sum(r * r))\\n\\n\\n# ---------------------------------------------------------------------------\\n# Jacobi solver\\n# ---------------------------------------------------------------------------\\n\\ndef solve_jacobi(grid, maxiter=10000, tol=1e-6, verbose=False):\\n    \\\"\\\"\\\"Jacobi iterative solver.  Solves ∇²φ = f in-place on *grid.phi*.\\n\\n    Returns (iterations, final_residual).\\n    \\\"\\\"\\\"\\n    dx2 = grid.dx * grid.dx\\n    dy2 = grid.dy * grid.dy\\n    denom = 2.0 / dx2 + 2.0 / dy2\\n\\n    for it in range(1, maxiter + 1):\\n        grid.apply_neumann()\\n        phi = grid.phi\\n        phi_new = phi.copy()\\n        phi_new[1:-1, 1:-1] = (\\n            (phi[2:, 1:-1] + phi[:-2, 1:-1]) / dx2\\n          + (phi[1:-1, 2:] + phi[1:-1, :-2]) / dy2\\n          - grid.rhs[1:-1, 1:-1]\\n        ) / denom\\n        grid.phi = phi_new\\n\\n        res = _residual(grid)\\n        if verbose and it % 500 == 0:\\n            print(f\\\"Jacobi iter {it}: residual = {res:.6e}\\\")\\n        if res < tol:\\n            return it, res\\n    return maxiter, _residual(grid)\\n\\n\\n# ---------------------------------------------------------------------------\\n# Conjugate-gradient solver (matrix-free)\\n# ---------------------------------------------------------------------------\\n\\ndef solve_cg(grid, maxiter=10000, tol=1e-6, verbose=False):\\n    \\\"\\\"\\\"CG solver on the flattened interior system.\\n\\n    Returns (iterations, final_residual).\\n    \\\"\\\"\\\"\\n    nx, ny = grid.nx, grid.ny\\n    dx, dy = grid.dx, grid.dy\\n\\n    def A_times(v):\\n        \\\"\\\"\\\"Apply discrete Laplacian to vector v (interior only).\\\"\\\"\\\"\\n        # Embed v into full array\\n        full = np.zeros((nx + 2, ny + 2), dtype=np.float64)\\n        full[1:-1, 1:-1] = v.reshape(nx, ny)\\n        # Copy boundary from grid.phi for Neumann support (ghost values)\\n        # Neumann ghost cells depend on interior values inside `full`, so\\n        # we replicate the apply_neumann logic on `full`.\\n        if 'left' in grid.neumann:\\n            full[0, :] = full[1, :]\\n        if 'right' in grid.neumann:\\n            full[-1, :] = full[-2, :]\\n        if 'bottom' in grid.neumann:\\n            full[:, 0] = full[:, 1]\\n        if 'top' in grid.neumann:\\n            full[:, -1] = full[:, -2]\\n        return _laplacian(full, dx, dy).ravel()\\n\\n    # RHS adjusted for boundary contributions\\n    # b = f_interior  (boundary phi assumed zero for Dirichlet,\\n    #  their contribution already appears through the stencil\\n    #  applied to grid.phi which holds BCs)\\n    # We solve A x = b  where  b = rhs_interior - contribution of BC ring\\n    # But for Dirichlet-zero BC the boundary is zero so b = rhs_interior.\\n    # For Neumann the ghost values mirror interior, handled inside A_times.\\n\\n    # Build effective RHS accounting for fixed (Dirichlet) boundary values\\n    # b_eff = rhs_interior - L_boundary_contribution\\n    # where L_boundary_contribution comes from the non-zero boundary in grid.phi\\n    bc_full = np.zeros_like(grid.phi)\\n    # Copy only boundary values\\n    bc_full[0, :] = grid.phi[0, :]\\n    bc_full[-1, :] = grid.phi[-1, :]\\n    bc_full[:, 0] = grid.phi[:, 0]\\n    bc_full[:, -1] = grid.phi[:, -1]\\n    bc_contrib = _laplacian(bc_full, dx, dy).ravel()\\n\\n    b = grid.rhs[1:-1, 1:-1].ravel() - bc_contrib\\n\\n    x = grid.phi[1:-1, 1:-1].ravel().copy()\\n    r = b - A_times(x)\\n    p = r.copy()\\n    rs_old = np.dot(r, r)\\n\\n    for it in range(1, maxiter + 1):\\n        Ap = A_times(p)\\n        pAp = np.dot(p, Ap)\\n        if abs(pAp) < 1e-30:\\n            break\\n        alpha = rs_old / pAp\\n        x += alpha * p\\n        r -= alpha * Ap\\n        rs_new = np.dot(r, r)\\n        res_norm = np.sqrt(rs_new)\\n        if verbose and it % 100 == 0:\\n            print(f\\\"CG iter {it}: residual = {res_norm:.6e}\\\")\\n        if res_norm < tol:\\n            grid.phi[1:-1, 1:-1] = x.reshape(nx, ny)\\n            grid.apply_neumann()\\n            return it, res_norm\\n        p = r + (rs_new / rs_old) * p\\n        rs_old = rs_new\\n\\n    grid.phi[1:-1, 1:-1] = x.reshape(nx, ny)\\n    grid.apply_neumann()\\n    return maxiter, np.sqrt(rs_old)\\n\\n\\n# ---------------------------------------------------------------------------\\n# Direct solver via scipy sparse\\n# ---------------------------------------------------------------------------\\n\\ndef solve_direct(grid, **_kwargs):\\n    \\\"\\\"\\\"Assemble sparse Laplacian and solve with spsolve.\\n\\n    Returns (1, final_residual).\\n    \\\"\\\"\\\"\\n    from scipy import sparse\\n    from scipy.sparse.linalg import spsolve\\n\\n    nx, ny = grid.nx, grid.ny\\n    dx2 = grid.dx * grid.dx\\n    dy2 = grid.dy * grid.dy\\n    N = nx * ny\\n\\n    def idx(i, j):\\n        return (i - 1) * ny + (j - 1)\\n\\n    rows, cols, vals = [], [], []\\n    rhs_vec = np.zeros(N, dtype=np.float64)\\n\\n    for i in range(1, nx + 1):\\n        for j in range(1, ny + 1):\\n            k = idx(i, j)\\n            diag = -2.0 / dx2 - 2.0 / dy2\\n\\n            # x-neighbours\\n            # left\\n            if i - 1 >= 1:\\n                rows.append(k); cols.append(idx(i - 1, j)); vals.append(1.0 / dx2)\\n            elif 'left' in grid.neumann:\\n                diag += 1.0 / dx2  # ghost = interior  =>  mirror\\n            else:\\n                rhs_vec[k] -= grid.phi[0, j] / dx2\\n\\n            # right\\n            if i + 1 <= nx:\\n                rows.append(k); cols.append(idx(i + 1, j)); vals.append(1.0 / dx2)\\n            elif 'right' in grid.neumann:\\n                diag += 1.0 / dx2\\n            else:\\n                rhs_vec[k] -= grid.phi[nx + 1, j] / dx2\\n\\n            # y-neighbours\\n            # bottom\\n            if j - 1 >= 1:\\n                rows.append(k); cols.append(idx(i, j - 1)); vals.append(1.0 / dy2)\\n            elif 'bottom' in grid.neumann:\\n                diag += 1.0 / dy2\\n            else:\\n                rhs_vec[k] -= grid.phi[i, 0] / dy2\\n\\n            # top\\n            if j + 1 <= ny:\\n                rows.append(k); cols.append(idx(i, j + 1)); vals.append(1.0 / dy2)\\n            elif 'top' in grid.neumann:\\n                diag += 1.0 / dy2\\n            else:\\n                rhs_vec[k] -= grid.phi[i, ny + 1] / dy2\\n\\n            rows.append(k); cols.append(k); vals.append(diag)\\n            rhs_vec[k] += grid.rhs[i, j]\\n\\n    # Adjust rhs for boundary contributions already encoded\\n    A = sparse.csr_matrix((vals, (rows, cols)), shape=(N, N))\\n    # rhs_vec already equals  f_interior - boundary_contribution\\n    # but we built it as  rhs_vec = rhs[i,j] - bc_contrib  which is correct.\\n    # However, we want A x = rhs_vec  where A x = L(phi_interior).\\n    # Actually: A phi = f  =>  phi = A^-1 f\\n    # rhs_vec = f - bc_contribution  (for Dirichlet non-zero BCs)\\n    sol = spsolve(A, rhs_vec)\\n    grid.phi[1:-1, 1:-1] = sol.reshape(nx, ny)\\n    grid.apply_neumann()\\n    res = _residual(grid)\\n    return 1, res\\n\"}"
