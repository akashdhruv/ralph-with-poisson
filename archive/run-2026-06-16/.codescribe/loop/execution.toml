args = "{\"path\": \"generated-src/poisson/grid.py\", \"content\": \"\\\"\\\"\\\"Grid class for 2-D Poisson problems.\\\"\\\"\\\"\\n\\nimport numpy as np\\n\\n\\nclass Grid:\\n    \\\"\\\"\\\"Uniform rectangular grid on [xmin,xmax] x [ymin,ymax].\\n\\n    The arrays ``phi`` and ``rhs`` have shape ``(nx+2, ny+2)`` so that\\n    indices 0 and nx+1 (resp. ny+1) hold boundary values.  Interior\\n    points are ``1:nx+1, 1:ny+1``.\\n\\n    Parameters\\n    ----------\\n    nx, ny : int\\n        Number of *interior* points in each direction.\\n    xmin, xmax, ymin, ymax : float\\n        Domain extents (default unit square).\\n    \\\"\\\"\\\"\\n\\n    def __init__(self, nx, ny, xmin=0.0, xmax=1.0, ymin=0.0, ymax=1.0):\\n        self.nx = nx\\n        self.ny = ny\\n        self.xmin, self.xmax = xmin, xmax\\n        self.ymin, self.ymax = ymin, ymax\\n\\n        self.dx = (xmax - xmin) / (nx + 1)\\n        self.dy = (ymax - ymin) / (ny + 1)\\n\\n        # Full arrays including boundary ring\\n        self.phi = np.zeros((nx + 2, ny + 2), dtype=np.float64)\\n        self.rhs = np.zeros((nx + 2, ny + 2), dtype=np.float64)\\n\\n        # Coordinate arrays (including boundary)\\n        self.x = xmin + np.arange(nx + 2) * self.dx\\n        self.y = ymin + np.arange(ny + 2) * self.dy\\n\\n        # Neumann flags: which boundary edges use zero-flux Neumann BC\\n        # Keys: 'left', 'right', 'bottom', 'top'\\n        self.neumann = set()\\n\\n    def apply_neumann(self):\\n        \\\"\\\"\\\"Apply zero-flux Neumann BCs by copying adjacent interior values\\n        into the ghost (boundary) cells.\\\"\\\"\\\"\\n        if 'left' in self.neumann:\\n            self.phi[0, :] = self.phi[1, :]\\n        if 'right' in self.neumann:\\n            self.phi[-1, :] = self.phi[-2, :]\\n        if 'bottom' in self.neumann:\\n            self.phi[:, 0] = self.phi[:, 1]\\n        if 'top' in self.neumann:\\n            self.phi[:, -1] = self.phi[:, -2]\\n\\n    def interior_coords(self):\\n        \\\"\\\"\\\"Return 2-D arrays of interior x, y coordinates.\\\"\\\"\\\"\\n        XX, YY = np.meshgrid(self.x[1:-1], self.y[1:-1], indexing='ij')\\n        return XX, YY\\n\"}"
